[package]
name = "tauri-plugin-sachiva-device"
version = "0.1.0"
authors = ["Sachiva contributors"]
description = "Device secrets and alarm access for Sachiva"
license = "MIT"
publish = false
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-sachiva-device"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
