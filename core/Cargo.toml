[package]
name = "sachiva-core"
version = "0.1.0"
description = "Tasks, priorities, reminders and the confidentiality checker for Sachiva"
license = "MIT"
edition = "2024"

[dependencies]
jiff = { version = "0.2", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
