# Builds a release when a tag like v0.1.0 is pushed. Jobs that touch the
# signing keys run in the `release` environment, which only accepts v* tags
# and waits for the owner's approval. Everything lands in a DRAFT release;
# the owner publishes it by hand after the checks at the end pass.
#
# Assets: Windows installer + portable zip, Linux AppImage + Arch package,
# Android APK, latest.json (for in-app updates), SHA256SUMS.txt.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REPO_URL: https://github.com/${{ github.repository }}
  # Public: the Android signing certificate, to check the APK against.
  APK_CERT_SHA256: 3652f531fe369a540b399aed86f9be6cfb168f68b9d64a1357eeea7088784ced

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tag matches every version number
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version app/package.json)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -1)
          echo "tag $tag, tauri.conf $conf, package.json $pkg, Cargo.toml $crate"
          [[ $tag == "$conf" && $tag == "$pkg" && $tag == "$crate" ]]
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no section ## [$tag]"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: UI check
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Leak scan
        run: |
          v=8.30.1
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/check-public.sh --history

  create:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Draft release with the changelog section as notes
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Sachiva $VERSION" --notes-file notes.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [check, create]
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - name: Build, sign the update files, upload to the draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SACHIVA_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SACHIVA_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create.outputs.id }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p portable/Sachiva
          cp target/release/sachiva.exe portable/Sachiva/
          printf 'This file marks the portable version of Sachiva. It cannot update itself.\r\n' > portable/Sachiva/portable
          cp packaging/windows/README-portable.txt portable/Sachiva/README.txt
          cp LICENSE portable/Sachiva/LICENSE.txt
          name="Sachiva_${VERSION}_x64_portable.zip"
          (cd portable && 7z a -tzip "../$name" Sachiva >/dev/null)
          gh release upload "$GITHUB_REF_NAME" "$name"
      - name: Keep the Linux program for the Arch package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-binary
          path: target/release/sachiva
          retention-days: 3

  arch:
    needs: [check, desktop]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-binary
          path: packaging/arch
      - name: makepkg (as a normal user, as it requires)
        env:
          SACHIVA_VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd packaging/arch
          cp -r ../../app/src-tauri/icons icons
          cp ../../LICENSE .
          useradd -m builder
          chown -R builder .
          su builder -c "SACHIVA_VERSION=$SACHIVA_VERSION PKGEXT=.pkg.tar.zst makepkg --nodeps --noconfirm"
          ls -l *.pkg.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          retention-days: 3

  android:
    needs: [check, create]
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          bin="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$bin/llvm-ranlib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the APK (unsigned)
        working-directory: app
        run: |
          npm ci
          npm run tauri android init -- --ci
          npm run tauri android build -- --ci --apk --target aarch64
      - name: Sign with the release key, then upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.SACHIVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SACHIVA_KEYSTORE_PASSWORD }}
        run: |
          tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          unsigned=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          test -n "$unsigned"
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          name="Sachiva_${VERSION}_aarch64.apk"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias sachiva --ks-pass env:KEYSTORE_PASSWORD \
            --out "$name" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$name"
          gh release upload "$GITHUB_REF_NAME" "$name"

  finish:
    needs: [check, create, desktop, arch, android]
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-package
          path: arch
      - name: Sign and upload the Arch package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SACHIVA_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SACHIVA_UPDATER_KEY_PASSWORD }}
        run: |
          (cd app && npm ci)
          pkg=$(ls arch/*.pkg.tar.zst)
          (cd app && npx tauri signer sign --app-version "$VERSION" "../$pkg")
          gh release upload "$GITHUB_REF_NAME" "$pkg" "$pkg.sig"
      - name: Download every asset of the draft
        run: gh release download "$GITHUB_REF_NAME" -D dist
      - name: Write latest.json for in-app updates
        run: |
          cd dist
          one() { local f; f=$(ls $1 2>/dev/null | head -1); [[ -n $f && -f $f.sig ]] || { echo "missing $1 or its .sig" >&2; exit 1; }; echo "$f"; }
          win=$(one '*-setup.exe'); img=$(one '*.AppImage'); pkg=$(one '*.pkg.tar.zst')
          base="$REPO_URL/releases/download/$GITHUB_REF_NAME"
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' ../CHANGELOG.md > notes.txt
          jq -n --arg v "$VERSION" --rawfile notes notes.txt --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wu "$base/$win" --rawfile ws "$win.sig" \
            --arg iu "$base/$img" --rawfile is "$img.sig" \
            --arg pu "$base/$pkg" --rawfile ps "$pkg.sig" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {url: $wu, signature: ($ws | rtrimstr("\n"))},
               "linux-x86_64": {url: $iu, signature: ($is | rtrimstr("\n"))},
               "linux-x86_64-pacman": {url: $pu, signature: ($ps | rtrimstr("\n"))}}}' > latest.json
          rm notes.txt
          jq . latest.json
      - name: Checks before the owner publishes
        run: |
          sudo apt-get update && sudo apt-get install -y minisign zstd libwebkit2gtk-4.1-0 libayatana-appindicator3-1
          cd dist
          jq -r .plugins.updater.pubkey ../app/src-tauri/tauri.conf.json | base64 -d > "$RUNNER_TEMP/updater.pub"
          echo "-- every update file is signed by our key, for this version"
          for sig in *.sig; do
            f=${sig%.sig}
            base64 -d "$sig" > "$RUNNER_TEMP/x.minisig"
            minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$f" -x "$RUNNER_TEMP/x.minisig" | tee "$RUNNER_TEMP/v.txt"
            grep -q "version:$VERSION" "$RUNNER_TEMP/v.txt" || { echo "$sig does not carry version $VERSION"; exit 1; }
          done
          echo "-- latest.json points at files in this release"
          for u in $(jq -r '.platforms[].url' latest.json); do test -f "${u##*/}"; done
          [[ $(jq '.platforms | length' latest.json) == 3 ]]
          echo "-- APK is signed with the release certificate"
          tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs Sachiva_*_aarch64.apk | tee "$RUNNER_TEMP/cert.txt"
          grep -q "SHA-256 digest: $APK_CERT_SHA256" "$RUNNER_TEMP/cert.txt"
          echo "-- AppImage starts and reports its version"
          chmod +x ./*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./*.AppImage --version | tee "$RUNNER_TEMP/ver.txt"
          grep -qx "Sachiva $VERSION" "$RUNNER_TEMP/ver.txt"
          echo "-- Arch package carries its marker and version"
          tar -tf ./*.pkg.tar.zst | grep -qx 'usr/lib/sachiva/install-type'
          tar -xOf ./*.pkg.tar.zst .PKGINFO | grep -qx "pkgver = $VERSION-1"
          echo "-- portable zip carries its marker"
          unzip -l ./*_portable.zip | grep -q 'Sachiva/portable$'
      - name: Upload latest.json and SHA256SUMS.txt
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" latest.json SHA256SUMS.txt
          echo "Draft ready: $REPO_URL/releases (publish it by hand)."
