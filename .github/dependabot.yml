# Weekly dependency updates, grouped so each ecosystem opens at most one
# routine pull request. Security fixes arrive separately, as soon as an
# advisory is published (repo setting: Dependabot security updates).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /plugins/device/android
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      gradle-plugins-device-android:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-app:
        update-types: [minor, patch]
